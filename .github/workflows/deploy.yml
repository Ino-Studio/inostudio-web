name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Only these paths are published. Anything else in the repo (dist/,
      # drafts, notes) stays private until it's added here.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html logo.png images clients _site/

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy --message "$GITHUB_SHA"

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://inostudio-web.ino-studio-s-account.workers.dev/ | grep -q '<title>Ino Studio'; then exit 0; fi
            sleep 6
          done
          echo "inostudio-web did not serve the page" >&2; exit 1
